# ============================================================
#  GreenLoop – Mail Server Configuration Template
#  Copy this file to email.properties and fill in your values.
#  NEVER commit email.properties — it's in .gitignore
# ============================================================

# ── SMTP Server ──────────────────────────────────────────────
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587

# ── Login credentials ────────────────────────────────────────
mail.smtp.username=your@email.com
mail.smtp.password=your_app_password_here

# ── Sender identity ──────────────────────────────────────────
mail.from.address=your@email.com
mail.from.name=GreenLoop System

# ── Security settings ────────────────────────────────────────
mail.smtp.starttls.enable=true
mail.smtp.ssl.enable=false
mail.smtp.auth=true

# ── Timeouts (milliseconds) ──────────────────────────────────
mail.smtp.connectiontimeout=10000
mail.smtp.timeout=10000
